name: Build and release macOS app

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: nowcast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      signed: ${{ steps.signing_mode.outputs.signed }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          version="$(bash scripts/version.sh --print)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            bash scripts/version.sh --check-tag "$GITHUB_REF_NAME"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Nowcast-$version-macOS-universal" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test rules and protocol
        run: swift test

      - name: Select release signing mode
        if: startsWith(github.ref, 'refs/tags/v')
        id: signing_mode
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          present=0
          for value in "$MACOS_CERTIFICATE_P12" "$APPLE_API_KEY_P8" "$APPLE_API_KEY_ID"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done

          if [[ "$present" == 0 ]]; then
            echo 'No Apple release credentials configured; publishing an unsigned release.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'NOWCAST_RELEASE_SIGNED=false' >> "$GITHUB_ENV"
          elif [[ "$present" == 3 ]]; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            echo 'NOWCAST_RELEASE_SIGNED=true' >> "$GITHUB_ENV"
          else
            echo 'Apple release credentials are only partially configured.' >&2
            exit 1
          fi

      - name: Configure Developer ID signing and notarization
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing_mode.outputs.signed == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for required in MACOS_CERTIFICATE_P12 APPLE_API_KEY_P8 APPLE_API_KEY_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required Actions secret: $required" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          keychain_path="$RUNNER_TEMP/nowcast-signing.keychain-db"
          keychain_password="$(uuidgen)"
          profile="nowcast-ci-$GITHUB_RUN_ID"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "${MACOS_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path"

          identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo 'The certificate does not contain a Developer ID Application identity.' >&2
            exit 1
          fi

          credentials=(--key "$api_key_path" --key-id "$APPLE_API_KEY_ID")
          if [[ -n "${APPLE_API_ISSUER_ID:-}" ]]; then
            credentials+=(--issuer "$APPLE_API_ISSUER_ID")
          fi
          xcrun notarytool store-credentials "$profile" "${credentials[@]}" \
            --keychain "$keychain_path" --validate

          echo "NOWCAST_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "NOWCAST_NOTARY_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "NOWCAST_NOTARY_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "NOWCAST_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "NOWCAST_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "NOWCAST_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build universal app and DMG
        shell: bash
        env:
          NOWCAST_BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/package.sh universal

      - name: Verify package
        shell: bash
        env:
          NOWCAST_BUILD_NUMBER: ${{ github.run_number }}
          NOWCAST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          app="dist/Nowcast.app"
          dmg="dist/Nowcast-$NOWCAST_VERSION-universal.dmg"
          lipo "$app/Contents/MacOS/Nowcast" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          test -f "$app/Contents/Resources/Nowcast.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = "Nowcast.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$NOWCAST_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$NOWCAST_BUILD_NUMBER"
          hdiutil verify "$dmg"
          (cd dist && shasum -a 256 -c "$(basename "$dmg").sha256")

          if [[ "${NOWCAST_RELEASE_SIGNED:-false}" == "true" ]]; then
            codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Signature=adhoc$'
          fi

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            dist/Nowcast-${{ steps.version.outputs.version }}-universal.dmg
            dist/Nowcast-${{ steps.version.outputs.version }}-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always() && startsWith(github.ref, 'refs/tags/v') && steps.signing_mode.outputs.signed == 'true'
        shell: bash
        run: |
          if [[ -n "${NOWCAST_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$NOWCAST_SIGNING_KEYCHAIN" || true
          fi
          rm -f "${NOWCAST_CERTIFICATE_PATH:-}" "${NOWCAST_API_KEY_PATH:-}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOWCAST_VERSION: ${{ needs.build.outputs.version }}
          NOWCAST_RELEASE_SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          release_args=(--verify-tag --generate-notes --title "Nowcast $GITHUB_REF_NAME")
          if [[ "$NOWCAST_RELEASE_SIGNED" != "true" ]]; then
            release_args+=(
              --notes "⚠️ This release is ad-hoc signed and not notarized. After copying Nowcast to Applications, follow the README's Terminal instructions for the first launch."
            )
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/Nowcast-$NOWCAST_VERSION-universal.dmg" \
            "dist/Nowcast-$NOWCAST_VERSION-universal.dmg.sha256" \
            "${release_args[@]}"
