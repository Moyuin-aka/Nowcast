name: Build and release macOS app

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: nowcast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          version="$(bash scripts/version.sh --print)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            bash scripts/version.sh --check-tag "$GITHUB_REF_NAME"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Nowcast-$version-macOS-universal" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test rules and protocol
        run: swift test

      - name: Build universal app and DMG
        shell: bash
        env:
          NOWCAST_BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/package.sh universal

      - name: Verify package
        shell: bash
        env:
          NOWCAST_BUILD_NUMBER: ${{ github.run_number }}
          NOWCAST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          app="dist/Nowcast.app"
          dmg="dist/Nowcast-$NOWCAST_VERSION-universal.dmg"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/Nowcast"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$NOWCAST_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$NOWCAST_BUILD_NUMBER"
          hdiutil verify "$dmg"
          (cd dist && shasum -a 256 -c "$(basename "$dmg").sha256")

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            dist/Nowcast-${{ steps.version.outputs.version }}-universal.dmg
            dist/Nowcast-${{ steps.version.outputs.version }}-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOWCAST_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Nowcast-$NOWCAST_VERSION-universal.dmg" \
            "dist/Nowcast-$NOWCAST_VERSION-universal.dmg.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Nowcast $GITHUB_REF_NAME"
